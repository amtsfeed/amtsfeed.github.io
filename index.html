<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amtsfeed — Kommunale Feeds entdecken</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dee2e6;
      --text: #212529;
      --muted: #6c757d;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --primary-light: #e7f1ff;
      --success: #198754;
      --badge-bg: #e9ecef;
      --badge-text: #495057;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-weight: 700; font-size: 18px; color: var(--primary); white-space: nowrap; text-decoration: none; }
    .logo span { color: var(--text); font-weight: 400; }
    .search-wrap { flex: 1; max-width: 480px; position: relative; }
    .search-input {
      width: 100%;
      padding: 8px 36px 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,110,253,.1); }
    .search-clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; display: none;
    }
    .basket-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); cursor: pointer; font-size: 13px; white-space: nowrap;
      transition: background .15s;
    }
    .basket-btn:hover { background: var(--bg); }
    .basket-count {
      background: var(--primary); color: #fff; border-radius: 12px;
      padding: 1px 7px; font-size: 11px; font-weight: 700; display: none;
    }
    .nav-link {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 12px; color: var(--muted); text-decoration: none; white-space: nowrap;
      background: var(--surface); transition: all .15s;
    }
    .nav-link:hover { color: var(--text); border-color: #adb5bd; }
    .nav-info {
      font-size: 11px; color: var(--muted); line-height: 1.4; white-space: nowrap;
    }
    .nav-info a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    .nav-info a:hover { color: var(--text); }
    @media (max-width: 900px) { .nav-info { display: none; } }
    @media (max-width: 600px) { .nav-link span:not(.nav-icon) { display: none; } }

    /* Layout */
    .layout { display: flex; height: calc(100vh - 57px); }

    /* Sidebar/browser */
    .browser {
      width: 320px; min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
    }
    .browser-header {
      padding: 14px 16px 10px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    /* Accordion */
    .acc-item {}
    .acc-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px; cursor: pointer; width: 100%;
      background: none; border: none; text-align: left; font-size: 13px;
      font-weight: 600; color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .acc-toggle:hover { background: var(--bg); }
    .acc-arrow { font-size: 10px; color: var(--muted); transition: transform .15s; }
    .acc-toggle.open .acc-arrow { transform: rotate(90deg); }
    .acc-body { display: none; }
    .acc-body.open { display: block; }

    .sub-acc-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 16px 7px 28px; cursor: pointer; width: 100%;
      background: none; border: none; text-align: left; font-size: 12px;
      font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .sub-acc-toggle:hover { background: var(--bg); }
    .sub-acc-toggle.open .acc-arrow { transform: rotate(90deg); }
    .sub-acc-body { display: none; }
    .sub-acc-body.open { display: block; }

    /* Feed items in browser */
    .feed-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px 7px 40px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .feed-item:hover { background: var(--primary-light); }
    .feed-item.selected { background: var(--primary-light); }
    .feed-checkbox {
      width: 15px; height: 15px; flex-shrink: 0; cursor: pointer;
      accent-color: var(--primary);
    }
    .feed-name { flex: 1; font-size: 13px; }
    .feed-badges { display: flex; gap: 3px; flex-shrink: 0; }
    .badge {
      font-size: 10px; padding: 1px 5px; border-radius: 3px;
      background: var(--badge-bg); color: var(--badge-text); white-space: nowrap;
    }
    .badge.event { background: #d1e7dd; color: #0a3622; }
    .badge.news { background: #fff3cd; color: #856404; }
    .badge.amtsblatt { background: #dde5ff; color: #2d3a8c; }
    .badge.notice { background: #f0e6ff; color: #5b21b6; }
    .filter-bar { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .filter-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    .filter-label input { accent-color: var(--primary); cursor: pointer; }

    /* Main content */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* Empty/loading state */
    .state-msg {
      text-align: center; color: var(--muted);
      margin-top: 60px; font-size: 15px;
    }

    /* Search results */
    .results-header {
      font-size: 12px; color: var(--muted); margin-bottom: 12px;
    }
    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .result-meta {
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    }
    .result-source {
      font-size: 11px; padding: 2px 6px; border-radius: 3px;
      background: var(--primary-light); color: var(--primary);
      font-weight: 600; cursor: pointer;
    }
    .result-source:hover { background: var(--primary); color: #fff; }
    .result-type {
      font-size: 11px; color: var(--muted);
    }
    .result-date {
      font-size: 11px; color: var(--muted); margin-left: auto;
    }
    .result-title {
      font-size: 14px; font-weight: 600; margin-bottom: 3px;
    }
    .result-title a { color: var(--text); text-decoration: none; }
    .result-title a:hover { color: var(--primary); }
    .result-desc {
      font-size: 12px; color: var(--muted); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .result-location {
      font-size: 11px; color: var(--muted); margin-top: 3px;
    }
    mark { background: #fff3cd; border-radius: 2px; padding: 0 1px; }

    /* Basket panel */
    .basket-panel {
      width: 320px; min-width: 280px;
      background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto; flex-shrink: 0; display: none;
    }
    .basket-panel.open { display: flex; flex-direction: column; }
    .basket-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .basket-title { font-size: 14px; font-weight: 700; }
    .basket-clear { font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: none; }
    .basket-clear:hover { color: #dc3545; }
    .basket-empty { padding: 20px 16px; color: var(--muted); font-size: 13px; }
    .basket-entry {
      border-bottom: 1px solid var(--border); padding: 12px 16px;
    }
    .basket-entry-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
    }
    .basket-entry-name { font-size: 13px; font-weight: 600; }
    .basket-remove { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
    .basket-remove:hover { color: #dc3545; }
    .basket-entry-path { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .basket-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .basket-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); margin: 8px 0 4px;
    }
    .basket-actions + .basket-section-label { margin-top: 10px; }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 4px; font-size: 12px;
      border: 1px solid var(--border); background: var(--bg);
      cursor: pointer; transition: all .15s;
    }
    .copy-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .copy-btn.copied { background: var(--success); color: #fff; border-color: var(--success); }
    .copy-btn--official { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .copy-btn--official:hover { background: var(--primary); color: #fff; }

    /* Loading indicator */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Two-column feed view */
    .feed-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      height: 100%;
    }
    .feed-col {
      overflow-y: auto;
      padding: 16px 16px 16px 0;
    }
    .feed-col + .feed-col {
      padding-left: 16px;
      border-left: 1px solid var(--border);
    }
    .col-header {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
      margin-bottom: 12px; padding-bottom: 6px;
      border-bottom: 2px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 1;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .feed-cols { grid-template-columns: 1fr; }
      .feed-col + .feed-col { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 16px; }
    }
    .mobile-toggle {
      display: none; background: none; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 10px; cursor: pointer; font-size: 16px;
      line-height: 1; color: var(--text);
    }
    .mobile-toggle:hover { background: var(--bg); }
    @media (max-width: 700px) {
      .mobile-toggle { display: inline-flex; }
      .browser {
        display: none; position: fixed; top: 57px; left: 0; right: 0; bottom: 0;
        width: 100%; z-index: 90; border-right: none;
      }
      .browser.mobile-open { display: block; }
      .basket-panel {
        position: fixed; top: 57px; left: 0; right: 0; bottom: 0;
        width: 100%; z-index: 90; border-left: none; border-top: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
<header>
  <button class="mobile-toggle" id="mobileToggle" title="Feeds durchsuchen">☰</button>
  <a class="logo" href="#">amts<span>feed</span></a>
  <div class="search-wrap">
    <input class="search-input" id="search" type="search" placeholder="Volltext suchen…" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="searchClear" title="Suche leeren">×</button>
  </div>
  <span class="nav-info">
    Suchergebnisse: <a href="https://github.com/amtsfeed/amtsfeed" target="_blank" rel="noopener">CC BY</a> ·
    Inhalte © jeweilige Körperschaften
  </span>
  <a class="nav-link" href="https://github.com/amtsfeed/amtsfeed.github.io" target="_blank" rel="noopener">
    <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <span>Quellcode</span>
  </a>
  <button class="basket-btn" id="basketBtn">
    <span>Mein Feed</span>
    <span class="basket-count" id="basketCount">0</span>
  </button>
</header>

<div class="layout">
  <nav class="browser" id="browser">
    <div class="browser-header">Feeds durchsuchen</div>
    <div class="filter-bar">
      <label class="filter-label"><input type="checkbox" id="filterEvent"      checked> Veranstaltung</label>
      <label class="filter-label"><input type="checkbox" id="filterNews"       checked> News</label>
      <label class="filter-label"><input type="checkbox" id="filterAmtsblatt"  checked> Amtsblatt</label>
      <label class="filter-label"><input type="checkbox" id="filterNotice"     checked> Bekanntmachung</label>
    </div>
    <div id="tree"></div>
  </nav>

  <main class="main" id="main">
    <div class="state-msg" id="stateMsg">Lädt…</div>
    <div id="results" hidden></div>
  </main>

  <aside class="basket-panel" id="basketPanel">
    <div class="basket-head">
      <span class="basket-title">Mein Feed</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="basket-clear" id="basketShare" title="Aktuelle Auswahl teilen" style="color:var(--primary)">Teilen</button>
        <button class="basket-clear" id="basketClearAll">Alle entfernen</button>
      </div>
    </div>
    <div id="basketContent"></div>
  </aside>
</div>

<script type="module">
const METADATA_URL = "https://raw.githubusercontent.com/amtsfeed/amtsfeed/main/wiki/metadata.json";

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  feeds: [],
  selected: new Set(),
  query: "",
  searchData: new Map(),   // path → { events, news, amtsblatt, notices }
  searchLoading: false,
  basketOpen: false,
  filter: { event: true, news: true, amtsblatt: true, notice: true },
};

// ── Fetch helpers ──────────────────────────────────────────────────────────
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) return null;
  return r.json();
}

async function loadFeedData(feed) {
  if (state.searchData.has(feed.path)) return state.searchData.get(feed.path);
  const [events, news, amtsblatt, notices] = await Promise.all([
    feed.eventsUrl     ? fetchJson(feed.eventsUrl)     : null,
    feed.newsUrl       ? fetchJson(feed.newsUrl)       : null,
    feed.amtsblattUrl  ? fetchJson(feed.amtsblattUrl)  : null,
    feed.noticesUrl    ? fetchJson(feed.noticesUrl)    : null,
  ]);
  const data = { events: events?.items ?? [], news: news?.items ?? [], amtsblatt: amtsblatt?.items ?? [], notices: notices?.items ?? [] };
  state.searchData.set(feed.path, data);
  return data;
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  const metadata = await fetchJson(METADATA_URL);
  if (!metadata) {
    document.getElementById("stateMsg").textContent = "Fehler beim Laden der Feed-Daten.";
    return;
  }
  state.feeds = metadata.feeds;
  renderTree();
  loadFromHash();
  document.getElementById("stateMsg").textContent = "";
  document.getElementById("stateMsg").style.display = "none";
  if (state.selected.size) {
    updateTreeSelection();
    updateBasketCount();
    updateMain();
  } else {
    showWelcome();
  }
}

// ── Tree ───────────────────────────────────────────────────────────────────
function buildHierarchy(feeds) {
  const tree = {};
  for (const feed of feeds) {
    const [bundesland, landkreis, ...rest] = feed.breadcrumb;
    if (!tree[bundesland]) tree[bundesland] = {};
    const lk = landkreis ?? "(kein Landkreis)";
    if (!tree[bundesland][lk]) tree[bundesland][lk] = [];
    tree[bundesland][lk].push(feed);
  }
  return tree;
}

function renderTree() {
  const tree = buildHierarchy(state.feeds);
  const container = document.getElementById("tree");
  container.innerHTML = "";

  for (const [bundesland, landkreise] of Object.entries(tree)) {
    const item = document.createElement("div");
    item.className = "acc-item";

    const toggle = document.createElement("button");
    toggle.className = "acc-toggle open";
    toggle.innerHTML = `<span class="acc-arrow">▶</span> ${bundesland}`;
    item.appendChild(toggle);

    const body = document.createElement("div");
    body.className = "acc-body open";

    for (const [landkreis, feeds] of Object.entries(landkreise)) {
      const subItem = document.createElement("div");

      const subToggle = document.createElement("button");
      subToggle.className = "sub-acc-toggle open";
      subToggle.innerHTML = `<span class="acc-arrow">▶</span> ${landkreis}`;
      subItem.appendChild(subToggle);

      const subBody = document.createElement("div");
      subBody.className = "sub-acc-body open";

      for (const feed of feeds) {
        subBody.appendChild(makeFeedRow(feed));
      }

      subToggle.addEventListener("click", () => {
        subToggle.classList.toggle("open");
        subBody.classList.toggle("open");
      });
      subItem.appendChild(subBody);
      body.appendChild(subItem);
    }

    toggle.addEventListener("click", () => {
      toggle.classList.toggle("open");
      body.classList.toggle("open");
    });

    item.appendChild(body);
    container.appendChild(item);
  }
}

function makeFeedRow(feed) {
  const row = document.createElement("div");
  row.className = "feed-item" + (state.selected.has(feed.path) ? " selected" : "");
  row.dataset.path = feed.path;

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "feed-checkbox";
  cb.checked = state.selected.has(feed.path);
  cb.addEventListener("change", (e) => {
    e.stopPropagation();
    toggleSelected(feed);
  });

  const name = document.createElement("span");
  name.className = "feed-name";
  name.textContent = feed.name;

  const badges = document.createElement("span");
  badges.className = "feed-badges";
  if (feed.eventCount > 0) badges.appendChild(makeBadge("V", "event", `${feed.eventCount} Veranstaltungen`));
  if (feed.newsCount > 0) badges.appendChild(makeBadge("N", "news", `${feed.newsCount} News`));
  if (feed.amtsblattCount > 0) badges.appendChild(makeBadge("A", "amtsblatt", `${feed.amtsblattCount} Amtsblätter`));
  if (feed.noticeCount > 0) badges.appendChild(makeBadge("B", "notice", `${feed.noticeCount} Bekanntmachungen`));

  row.appendChild(cb);
  row.appendChild(name);
  row.appendChild(badges);

  row.addEventListener("click", (e) => {
    if (e.target === cb) return;
    toggleSelected(feed);
  });

  return row;
}

function makeBadge(text, cls, title) {
  const b = document.createElement("span");
  b.className = `badge ${cls}`;
  b.textContent = text;
  if (title) b.title = title;
  return b;
}

// ── Hash / deep-link ──────────────────────────────────────────────────────
function updateHash() {
  if (!state.selected.size) {
    history.replaceState(null, "", location.pathname + location.search);
    return;
  }
  const hash = [...state.selected].map(p => encodeURIComponent(p)).join("|");
  history.replaceState(null, "", "#" + hash);
}

function loadFromHash() {
  const raw = location.hash.slice(1);
  if (!raw) return;
  for (const part of raw.split("|")) {
    try {
      const path = decodeURIComponent(part);
      if (state.feeds.some(f => f.path === path)) state.selected.add(path);
    } catch {}
  }
}

// ── Selection ──────────────────────────────────────────────────────────────
function toggleSelected(feed) {
  if (state.selected.has(feed.path)) {
    state.selected.delete(feed.path);
  } else {
    state.selected.add(feed.path);
  }
  updateHash();
  updateTreeSelection();
  renderBasket();
  updateBasketCount();
  document.getElementById("browser").classList.remove("mobile-open");
  if (!state.query) updateMain();
}

function updateTreeSelection() {
  document.querySelectorAll(".feed-item").forEach(row => {
    const selected = state.selected.has(row.dataset.path);
    row.classList.toggle("selected", selected);
    const cb = row.querySelector("input[type=checkbox]");
    if (cb) cb.checked = selected;
  });
}

// ── Welcome ────────────────────────────────────────────────────────────────
function resetMainStyle() {
  const main = document.getElementById("main");
  main.style.padding = "";
  main.style.overflow = "";
}

function showWelcome() {
  resetMainStyle();
  const main = document.getElementById("main");
  const total = state.feeds.reduce((s, f) => s + f.eventCount + f.newsCount, 0);
  main.innerHTML = `
    <div style="max-width:560px;margin:40px auto 0;text-align:center;color:var(--muted)">
      <div style="font-size:32px;margin-bottom:12px">📡</div>
      <h2 style="color:var(--text);font-size:18px;margin-bottom:8px">Kommunale Feeds entdecken</h2>
      <p style="margin-bottom:6px">${state.feeds.length} Gemeinden und Ämter — ${total.toLocaleString("de")} Einträge insgesamt</p>
      <p>Links im Feed-Browser auswählen, um Feeds zu abonnieren.<br>Oder oben nach Themen und Orten suchen.</p>
    </div>`;
}

// ── Main area (selected feeds, no query) ───────────────────────────────────
async function updateMain() {
  if (state.query) return;
  if (!state.selected.size) { showWelcome(); return; }

  const main = document.getElementById("main");
  main.innerHTML = `<div class="state-msg"><div class="spinner"></div>&ensp;Lade Einträge…</div>`;

  const selectedFeeds = state.feeds.filter(f => state.selected.has(f.path));
  const events = [], news = [];

  const amtsblatt = [], notices = [];
  await Promise.all(selectedFeeds.map(async (feed) => {
    const data = await loadFeedData(feed);
    for (const ev of data.events)    events.push({ type: "event",      feed, item: ev });
    for (const n of data.news)       news.push({ type: "news",        feed, item: n });
    for (const a of data.amtsblatt)  amtsblatt.push({ type: "amtsblatt", feed, item: a });
    for (const c of data.notices)    notices.push({ type: "notice",    feed, item: c });
  }));

  if (state.query) return;

  const now = Date.now();

  // Left column: past/current items sorted descending (most recent first)
  const pastEvents = events.filter(e => new Date(e.item.startDate).getTime() < now);
  const recent = [
    ...(state.filter.event     ? pastEvents  : []),
    ...(state.filter.news      ? news        : []),
    ...(state.filter.amtsblatt ? amtsblatt   : []),
    ...(state.filter.notice    ? notices     : []),
  ].sort((a, b) => {
    const da = a.type === "event" ? a.item.startDate : (a.item.publishedAt ?? a.item.fetchedAt);
    const db = b.type === "event" ? b.item.startDate : (b.item.publishedAt ?? b.item.fetchedAt);
    return new Date(db) - new Date(da);
  });

  // Right column: upcoming events (asc), then news (asc by publishedAt)
  const upcoming = state.filter.event
    ? events.filter(e => new Date(e.item.startDate).getTime() >= now)
        .sort((a, b) => new Date(a.item.startDate) - new Date(b.item.startDate))
    : [];
  const upcomingNews = state.filter.news
    ? [...news].sort((a, b) => new Date(a.item.publishedAt ?? a.item.fetchedAt) - new Date(b.item.publishedAt ?? b.item.fetchedAt))
    : [];
  const future = [...upcoming, ...upcomingNews];

  main.innerHTML = "";
  const cols = document.createElement("div");
  cols.className = "feed-cols";

  const left = document.createElement("div");
  left.className = "feed-col";
  const leftHeader = document.createElement("div");
  leftHeader.className = "col-header";
  leftHeader.textContent = `Neueste Einträge (${recent.length})`;
  left.appendChild(leftHeader);
  for (const { type, feed, item } of recent) left.appendChild(makeResultCard(type, feed, item, ""));

  const right = document.createElement("div");
  right.className = "feed-col";
  const rightHeader = document.createElement("div");
  rightHeader.className = "col-header";
  rightHeader.textContent = upcoming.length
    ? `Nächste Veranstaltungen (${upcoming.length})`
    : `Demnächst (${future.length})`;
  right.appendChild(rightHeader);
  for (const { type, feed, item } of future) right.appendChild(makeResultCard(type, feed, item, ""));

  cols.appendChild(left);
  cols.appendChild(right);
  main.appendChild(cols);
  main.style.padding = "0";
  main.style.overflow = "hidden";
}

// ── Search ─────────────────────────────────────────────────────────────────
let searchTimer = null;

function onSearch(query) {
  state.query = query.trim();
  document.getElementById("searchClear").style.display = state.query ? "block" : "none";
  clearTimeout(searchTimer);
  if (!state.query) {
    updateMain();
    return;
  }
  searchTimer = setTimeout(() => runSearch(state.query), 300);
}

async function runSearch(query) {
  resetMainStyle();
  const main = document.getElementById("main");
  main.innerHTML = `<div class="state-msg"><div class="spinner"></div>&ensp;Durchsuche…</div>`;

  const results = [];
  const q = query.toLowerCase();

  await Promise.all(state.feeds.map(async (feed) => {
    const data = await loadFeedData(feed);
    if (state.filter.event) for (const ev of data.events) {
      if (matches(ev.title, ev.description, ev.location, q)) results.push({ type: "event", feed, item: ev });
    }
    if (state.filter.news) for (const n of data.news) {
      if (matches(n.title, n.description, null, q)) results.push({ type: "news", feed, item: n });
    }
    if (state.filter.amtsblatt) for (const a of data.amtsblatt) {
      if (matches(a.title, null, null, q)) results.push({ type: "amtsblatt", feed, item: a });
    }
    if (state.filter.notice) for (const c of data.notices) {
      if (matches(c.title, null, null, q)) results.push({ type: "notice", feed, item: c });
    }
  }));

  if (state.query !== query) return; // stale

  results.sort((a, b) => {
    const da = a.type === "event" ? a.item.startDate : (a.item.publishedAt ?? a.item.fetchedAt);
    const db = b.type === "event" ? b.item.startDate : (b.item.publishedAt ?? b.item.fetchedAt);
    return new Date(db) - new Date(da);
  });

  renderResults(results, query);
}

function matches(...args) {
  const q = args.pop();
  return args.some(s => s?.toLowerCase().includes(q));
}

function renderResults(results, query) {
  const main = document.getElementById("main");
  if (!results.length) {
    main.innerHTML = `<div class="state-msg">Keine Ergebnisse für „${escapeHtml(query)}".</div>`;
    return;
  }

  const header = document.createElement("div");
  header.className = "results-header";
  header.textContent = `${results.length} Ergebnisse für „${query}"`;
  main.innerHTML = "";
  main.appendChild(header);

  for (const { type, feed, item } of results) {
    main.appendChild(makeResultCard(type, feed, item, query));
  }
}

function makeResultCard(type, feed, item, query) {
  const card = document.createElement("div");
  card.className = "result-card";

  const date = type === "event"
    ? item.startDate
    : (item.publishedAt ?? item.fetchedAt);
  const dateStr = date ? new Date(date).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
  const typeLabel = type === "event" ? "Veranstaltung" : type === "amtsblatt" ? "Amtsblatt" : type === "notice" ? "Bekanntmachung" : "Nachricht";

  card.innerHTML = `
    <div class="result-meta">
      <span class="result-source" data-path="${escapeHtml(feed.path)}">${escapeHtml(feed.name)}</span>
      <span class="result-type">${typeLabel}</span>
      <span class="result-date">${dateStr}</span>
    </div>
    <div class="result-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${highlight(item.title, query)}</a></div>
    ${item.description ? `<div class="result-desc">${highlight(item.description, query)}</div>` : ""}
    ${type === "event" && item.location ? `<div class="result-location">📍 ${escapeHtml(item.location)}</div>` : ""}
  `;

  card.querySelector(".result-source").addEventListener("click", () => {
    const f = state.feeds.find(x => x.path === feed.path);
    if (f) {
      if (!state.selected.has(f.path)) {
        toggleSelected(f);
        if (!state.basketOpen) openBasket();
      }
    }
  });

  return card;
}

function highlight(text, query) {
  if (!text || !query) return escapeHtml(text ?? "");
  const escaped = escapeHtml(text);
  const re = new RegExp(`(${escapeRe(query)})`, "gi");
  return escaped.replace(re, "<mark>$1</mark>");
}

function escapeHtml(s) {
  return (s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// ── Basket ─────────────────────────────────────────────────────────────────
function openBasket() {
  state.basketOpen = true;
  document.getElementById("basketPanel").classList.add("open");
  renderBasket();
}

function closeBasket() {
  state.basketOpen = false;
  document.getElementById("basketPanel").classList.remove("open");
}

function renderBasket() {
  const content = document.getElementById("basketContent");
  if (!state.selected.size) {
    content.innerHTML = `<div class="basket-empty">Noch keine Feeds ausgewählt.<br>Klicke im Browser links auf eine Gemeinde.</div>`;
    return;
  }

  content.innerHTML = "";
  for (const path of state.selected) {
    const feed = state.feeds.find(f => f.path === path);
    if (!feed) continue;
    const crumb = feed.breadcrumb.slice(0, -1).join(" › ");

    const sources = feed.sources ?? [];
    const officialRss  = sources.find(s => s.type === "rss");
    const officialIcal = sources.find(s => s.type === "ical");

    const officialButtons = sources.map(s => {
      const label = s.title ?? (s.type === "rss" ? "RSS Nachrichten/Amtsblätter/Bekanntmachungen" : "iCal Veranstaltungen");
      return `<button class="copy-btn copy-btn--official" data-url="${escapeHtml(s.url)}" data-label="${escapeHtml(label)}">📋 ${escapeHtml(label)}</button>`;
    }).join("");

    const generatedButtons = [
      !officialRss  && feed.rssUrl  ? `<button class="copy-btn copy-btn--generated" data-url="${escapeHtml(feed.rssUrl)}"  data-label="RSS Nachrichten/Amtsblätter/Bekanntmachungen (amtsfeed)">📋 RSS Nachrichten/Amtsblätter/Bekanntmachungen</button>` : "",
      !officialIcal && feed.icalUrl ? `<button class="copy-btn copy-btn--generated" data-url="${escapeHtml(feed.icalUrl)}" data-label="iCal Veranstaltungen (amtsfeed)">📋 iCal Veranstaltungen</button>` : "",
    ].join("");

    const entry = document.createElement("div");
    entry.className = "basket-entry";
    entry.innerHTML = `
      <div class="basket-entry-head">
        <span class="basket-entry-name">${escapeHtml(feed.name)}</span>
        <button class="basket-remove" data-path="${escapeHtml(path)}" title="Entfernen">×</button>
      </div>
      ${crumb ? `<div class="basket-entry-path">${escapeHtml(crumb)}</div>` : ""}
      ${officialButtons ? `<div class="basket-section-label">Offizielle Quelle</div><div class="basket-actions">${officialButtons}</div>` : ""}
      ${generatedButtons ? `<div class="basket-section-label">amtsfeed</div><div class="basket-actions">${generatedButtons}</div>` : ""}
      ${!officialButtons && !generatedButtons ? `<div class="basket-empty" style="padding:4px 0;font-size:12px;">Kein abonnierbarer Feed verfügbar.</div>` : ""}`;

    entry.querySelector(".basket-remove").addEventListener("click", () => {
      const f = state.feeds.find(x => x.path === path);
      if (f) toggleSelected(f);
    });

    entry.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => copyUrl(btn, btn.dataset.url, btn.dataset.label));
    });

    content.appendChild(entry);
  }
}

async function copyUrl(btn, url, label) {
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = `✓ ${label} kopiert`;
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = `📋 ${label} kopieren`;
      btn.classList.remove("copied");
    }, 2000);
  } catch {
    prompt(`${label}-URL:`, url);
  }
}

function updateBasketCount() {
  const count = document.getElementById("basketCount");
  const n = state.selected.size;
  count.textContent = n;
  count.style.display = n ? "inline" : "none";
}

// ── Events ─────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => onSearch(e.target.value));
document.getElementById("searchClear").addEventListener("click", () => {
  document.getElementById("search").value = "";
  onSearch("");
});

document.getElementById("basketBtn").addEventListener("click", () => {
  if (state.basketOpen) closeBasket(); else openBasket();
});

document.getElementById("basketShare").addEventListener("click", async () => {
  const url = location.href;
  const names = [...state.selected].map(p => state.feeds.find(f => f.path === p)?.name).filter(Boolean).join(", ");
  const shareData = { title: `amtsfeed — ${names}`, url };
  const btn = document.getElementById("basketShare");
  if (navigator.share) {
    try { await navigator.share(shareData); } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = "✓ Link kopiert";
      setTimeout(() => { btn.textContent = "Teilen"; }, 2000);
    } catch {
      prompt("Link:", url);
    }
  }
});

document.getElementById("mobileToggle").addEventListener("click", () => {
  const browser = document.getElementById("browser");
  browser.classList.toggle("mobile-open");
});

document.getElementById("basketClearAll").addEventListener("click", () => {
  state.selected.clear();
  updateHash();
  updateTreeSelection();
  renderBasket();
  updateBasketCount();
  if (!state.query) updateMain();
});

// ── Filter checkboxes ─────────────────────────────────────────────────────
function onFilterChange() {
  state.filter.event     = document.getElementById("filterEvent").checked;
  state.filter.news      = document.getElementById("filterNews").checked;
  state.filter.amtsblatt = document.getElementById("filterAmtsblatt").checked;
  state.filter.notice    = document.getElementById("filterNotice").checked;
  if (state.query) runSearch(state.query);
  else updateMain();
}
document.getElementById("filterEvent").addEventListener("change", onFilterChange);
document.getElementById("filterNews").addEventListener("change", onFilterChange);
document.getElementById("filterAmtsblatt").addEventListener("change", onFilterChange);
document.getElementById("filterNotice").addEventListener("change", onFilterChange);

// ── Boot ───────────────────────────────────────────────────────────────────
init();
</script>
